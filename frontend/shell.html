<!doctype html>
<!-- The page of a recomp built with n64recomp_browser_frontend (CMakeLists.txt): a canvas filling the window, which SDL's window
     is and RT64 draws on (SDL follows its CSS size), and a line saying what is loading or what went wrong. The program
     sets the title through SDL. coi_serviceworker.js makes the page cross-origin isolated where the server doesn't,
     and the program starts only once it is (below).
     The #gpu notice (below) is for Firefox on Intel graphics. #shaders, in a corner, is the progress of the
     shaders the game waits for (RasterShaderCache::startPrebuild(), a game's RT64_PREBUILT_SHADER_LIST), over the frame
     it holds meanwhile. The browser keeps them, so a later visit builds them in under a second, and the indicator shows
     only if they take longer than one.
     A lost WebGPU device (a driver update or reset, the browser's GPU process crashing, a laptop switching GPUs) says
     so on the status line, over the last frame, which stands still from then on while the game runs behind it: nothing
     in plume or RT64 asks for a new device, which would mean making again everything RT64 made on the old one, and a
     reload is the one recovery. The page itself never destroys its device.
     Pointer lock asks for the mouse's raw counts (below). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  #status { position: fixed; left: 0; right: 0; top: 40%; text-align: center; color: #ccc;
            font: 18px system-ui, sans-serif; white-space: pre-line; pointer-events: none; }
  #status.failed { padding: 12px; background: #000c; }
  #gpu { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); max-width: 46em; padding: 8px 32px 8px 12px;
         background: #222d; color: #ddd; border-radius: 6px; font: 14px/1.4 system-ui, sans-serif; }
  #gpu code { font-size: 13px; }
  #gpu[hidden], #shaders[hidden] { display: none; }
  #shaders { position: fixed; right: 14px; bottom: 14px; display: flex; align-items: center; gap: 8px; padding: 6px 10px;
             background: #0009; color: #bbb; border-radius: 4px; font: 12px/1 system-ui, sans-serif;
             font-variant-numeric: tabular-nums; pointer-events: none; }
  #shaders .spin { width: 10px; height: 10px; border: 2px solid #fff3; border-top-color: #ccc; border-radius: 50%;
                   animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #gpu button { position: absolute; right: 6px; top: 4px; border: 0; background: none; color: #aaa; font-size: 18px;
                cursor: pointer; }
</style>
<script src="coi_serviceworker.js"></script>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Loading…</div>
<template id="program">{{{ SCRIPT }}}</template>
<div id="shaders" hidden><span class="spin"></span><span>Preparing graphics</span><span class="figures"></span></div>
<div id="gpu" hidden><span>Firefox runs this at half speed on Intel graphics. Either play in Chrome or Edge, or set
  <code>gfx.webrender.compositor</code> to false in <code>about:config</code>. If this PC also has a graphics card,
  setting Firefox to High performance in Windows' Graphics settings works too.</span><button title="Close" onclick="this.parentNode.hidden = true">×</button></div>
<script>
  const statusLine = document.getElementById('status');
  const fail = (text) => { statusLine.textContent = text; statusLine.style.color = '#f88'; statusLine.className = 'failed'; };
  if (!window.crossOriginIsolated) {
    fail('This page needs cross-origin isolation for its threads. Reload it once; if that doesn\'t help, the server must ' +
         'send Cross-Origin-Opener-Policy: same-origin and Cross-Origin-Embedder-Policy: require-corp.');
  } else if (!navigator.gpu) {
    fail('This browser has no WebGPU. It runs in a recent Chrome or Edge.');
  }
  // RT64 reports each shader built, with the fraction done by size, the ones in flight counted half done
  // (rt64ShaderProgress), once before the game starts and again whenever it goes somewhere new, a level whose shaders
  // aren't built yet. The indicator shows after a second of it, so a round the browser's cache makes quick shows
  // nothing. The time left is the time so far scaled by what is left, once there is enough to go on.
  let shaders = null;
  const shaderProgress = (done, count, fraction) => {
    const box = document.getElementById('shaders');
    if (done >= count) {
      if (shaders) { clearTimeout(shaders.show); clearInterval(shaders.tick); }
      box.hidden = true;
      shaders = null;
      return;
    }
    if (!shaders) {
      shaders = { start: performance.now(), show: setTimeout(() => { box.hidden = false; }, 1000),
                  tick: setInterval(() => shaders.render(), 500) };
      shaders.render = () => {
        const seconds = (performance.now() - shaders.start) / 1000;
        box.querySelector('.figures').textContent = Math.floor(shaders.fraction * 100) + '%' + ((shaders.fraction >= 0.1) ?
          ' · ' + Math.max(1, Math.round(seconds * (1 - shaders.fraction) / shaders.fraction)) + ' s left' : '');
      };
    }
    Object.assign(shaders, { done, count, fraction });
    shaders.render();
  };
  // The shaders the game asked for that its prebuilt list missed, which RT64 builds with their section on the next visit
  // (rt64-web's RasterShaderCache::learnPrebuild): an array of [section, five shader words] for this page and this
  // list, kept in localStorage, the lists before it dropped.
  const learnedKey = (list) => 'rt64-learned-shaders ' + location.pathname + ' ' + list;
  const learnedShaders = (list) => {
    try { return JSON.parse(localStorage.getItem(learnedKey(list)) ?? '[]'); } catch { return []; }
  };
  const shaderMissed = (list, entry) => {
    const learned = learnedShaders(list);
    if ((learned.length >= 1000) || learned.some((e) => e.join() === entry.join())) return;
    learned.push(entry);
    try {
      const prefix = learnedKey('');
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const key = localStorage.key(i);
        if (key.startsWith(prefix) && (key !== learnedKey(list))) localStorage.removeItem(key);
      }
      localStorage.setItem(learnedKey(list), JSON.stringify(learned));
    } catch {}
  };
  var Module = {
    canvas: document.getElementById('canvas'),
    setStatus: (text) => { if (!statusLine.style.color) statusLine.textContent = text; },
    onRuntimeInitialized: () => {
      statusLine.textContent = '';
      // plume_webgpu_device.js has made the device by now: it holds the program back until it has.
      Module.preinitializedWebGPUDevice?.lost.then((info) => {
        document.exitPointerLock?.();
        fail('The game\'s graphics stopped: the browser lost its WebGPU device' + (info.message ? ' (' + info.message.replace(/\.$/, '') + ')' : '') +
             '.\nReload the page to carry on.');
      });
    },
    onAbort: (what) => fail('Stopped: ' + what),
    rt64ShaderProgress: (done, count, fraction) => shaderProgress(done, count, fraction),
    rt64LearnedShaders: learnedShaders,
    rt64ShaderMissed: shaderMissed,
  };
  // Firefox on Windows hands the canvas to Windows' compositor (WebRender's native compositor, DirectComposition),
  // redrawing it every frame at device pixels and blending it as if it had alpha. On a laptop's Intel graphics (Tiger
  // Lake GT1, 4K at 200%) a present then takes 27-83 ms on the GPU, against 9-25 with gfx.webrender.compositor false,
  // and the games fall from 60 to 30-45; a discrete GPU has room for it (docs/findings.md, A laptop, measured). Set to
  // High performance in Windows' graphics settings, Firefox on that laptop runs on its NVIDIA card (it ignores the
  // page's powerPreference) and holds 60 in Banjo and GoldenEye, presents done in 2-4 ms. Chrome holds 60 on the Intel
  // graphics, so the notice, which names all three fixes, is Firefox's only.
  // Firefox's WebGPU adapter info is empty, but its WebGL renderer still names the vendor, generalized ("ANGLE (Intel,
  // Intel(R) HD Graphics Direct3D11 vs_5_0 ps_5_0), or similar"), so the notice shows only for Intel's integrated
  // graphics, leaving out an Arc card where the name says so. Without WebGPU the status line already says so.
  const intelGraphics = () => {
    try {
      const gl = document.createElement('canvas').getContext('webgl');
      if (!gl) return false;
      const renderer = String(gl.getParameter(gl.RENDERER));
      gl.getExtension('WEBGL_lose_context')?.loseContext();
      return /\bIntel\b/i.test(renderer) && !/\bArc\b/i.test(renderer);
    } catch { return false; }
  };
  if (navigator.gpu && /Firefox\//.test(navigator.userAgent) && /Windows/.test(navigator.userAgent) && intelGraphics()) {
    document.getElementById('gpu').hidden = false;
  }
  // A game that looks with the mouse (SDL's relative mode, whose pointer lock Emscripten asks for with no options) gets
  // the mouse's own counts, as SDL reads them on a desktop (raw input), not the cursor's motion. Without them a
  // browser keeps the locked cursor in place by moving it back, and takes each move back out of the motion it reports
  // (Firefox's coalesced pointer events show them): a move counted against the wrong position is a jump, which turned
  // GoldenEye's view tens of degrees at once in fast turns (running, strafing and turning). A browser that has no raw
  // counts (NotSupportedError) gets the lock without them.
  const requestPointerLock = Element.prototype.requestPointerLock;
  if (requestPointerLock) {
    Element.prototype.requestPointerLock = function (options) {
      const locked = requestPointerLock.call(this, { unadjustedMovement: true, ...options });
      return locked?.catch((e) => {
        if (e.name !== 'NotSupportedError') throw e;
        return requestPointerLock.call(this, options);
      }) ?? locked;
    };
  }
  // The program (its script, in #program) starts only on a page that is cross-origin isolated, which it needs anyway.
  // A first visit to a host that can't send the headers isn't, and coi_serviceworker.js reloads it: started there, the
  // program fetched its .wasm and .data only for the reload to cut them off, and in Firefox (158, from GitHub Pages)
  // the reloaded page's fetches of the same files then failed in 4 of 58 cold visits, which never started; with
  // nothing fetched before the reload, none of 30 failed.
  if (window.crossOriginIsolated) document.body.append(document.importNode(document.getElementById('program').content, true));
</script>
</body>
</html>
